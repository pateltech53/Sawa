<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Kufi"; src: url("assets/fonts/kufi.woff2") format("woff2"); font-weight: 100 900; }
      :root {
        --ink: #121217;
        --grey: #57524f;
        --blue: #3f6cbf;
        --font: "Inter", sans-serif;
        --ar: "Kufi", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #d9d4cc; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--font); color: var(--ink); }

      /* Silk ground from the Figma file + drifting colour for the glass to refract */
      .ground { position: absolute; inset: 0; background: url("assets/silk.jpg") center / cover; }
      .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .6; }
      .o1 { width: 900px; height: 900px; left: -220px; top: -260px; background: #8fb0ee; }
      .o2 { width: 760px; height: 760px; right: -200px; top: 220px; background: #c9b6f2; }
      .o3 { width: 820px; height: 820px; left: 520px; bottom: -420px; background: #f0d2b0; }
      .o4 { width: 460px; height: 460px; right: 380px; top: -160px; background: #a6d8e8; opacity: .45; }

      /* Liquid glass: blur + saturation, specular rim, inner glow */
      .lg {
        position: absolute; isolation: isolate;
        background: linear-gradient(135deg, rgba(255,255,255,.46) 0%, rgba(255,255,255,.16) 55%, rgba(255,255,255,.28) 100%);
        backdrop-filter: blur(26px) saturate(185%) brightness(1.04);
        -webkit-backdrop-filter: blur(26px) saturate(185%) brightness(1.04);
        box-shadow: inset 0 1.5px 1px rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.3),
          inset 0 0 36px rgba(255,255,255,.18), 0 30px 60px -30px rgba(28,32,70,.5), 0 4px 12px -6px rgba(28,32,70,.16);
      }
      .lg::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
        background: linear-gradient(135deg, rgba(255,255,255,.98), rgba(255,255,255,.16) 32%, rgba(255,255,255,0) 52%, rgba(255,255,255,.22) 76%, rgba(255,255,255,.9));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
      }
      .sheen { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; overflow: hidden; }
      .sheen::after {
        content: ""; position: absolute; top: -40%; left: -60%; width: 40%; height: 180%; transform: rotate(18deg);
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
      }

      /* ── Intro ── */
      #intro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .intro-card { position: relative; width: 980px; height: 560px; border-radius: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .intro-card .mascot { width: 230px; height: auto; margin-bottom: 10px; filter: drop-shadow(0 24px 30px rgba(28,32,70,.25)); }
      .word { font-size: 104px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
      .word span { font-family: var(--ar); font-weight: 700; color: rgba(18,18,23,.62); letter-spacing: 0; margin-left: 18px; }
      .tag { margin-top: 20px; font-size: 34px; font-weight: 500; color: var(--grey); }
      .tag-ar { margin-top: 6px; font-family: var(--ar); font-size: 30px; color: var(--grey); direction: rtl; }

      /* ── Demo ── */
      #demo { position: absolute; inset: 0; }
      .brand { position: absolute; left: 72px; top: 64px; height: 84px; border-radius: 42px; padding: 0 30px 0 14px; display: flex; align-items: center; gap: 12px; }
      .brand img { width: 58px; height: 58px; }
      .brand b { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
      .brand i { font-style: normal; font-size: 28px; font-weight: 600; color: var(--grey); margin-left: 6px; }
      .phone { position: absolute; left: 480px; top: 48px; width: 476px; height: 984px; border-radius: 68px; padding: 16px; }
      .phone video { position: relative; display: block; width: 444px; height: 952px; border-radius: 54px; object-fit: cover; background: #ddd; box-shadow: 0 0 0 1px rgba(255,255,255,.6); }

      .cap { position: absolute; left: 1040px; top: 380px; width: 780px; border-radius: 48px; padding: 44px 52px 46px; opacity: 0; }
      .cap .n { font-size: 28px; font-weight: 700; letter-spacing: .14em; color: var(--blue); }
      .cap .en { margin-top: 12px; font-size: 68px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; }
      .cap .ar { margin-top: 18px; font-family: var(--ar); font-size: 48px; font-weight: 700; line-height: 1.35; direction: rtl; text-align: right; color: rgba(18,18,23,.72); }

      .dots { position: absolute; left: 1092px; top: 862px; height: 44px; border-radius: 22px; padding: 0 20px; display: flex; align-items: center; gap: 12px; }
      .dot { width: 10px; height: 10px; border-radius: 5px; background: rgba(18,18,23,.18); }
      .dot.on { background: var(--ink); }

      /* ── Outro ── */
      #outro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .out-card { position: relative; width: 1240px; height: 640px; border-radius: 72px; display: flex; align-items: center; gap: 70px; padding: 0 80px; }
      .qr { width: 420px; height: 420px; border-radius: 40px; overflow: hidden; box-shadow: 0 24px 48px -24px rgba(28,32,70,.45); flex: none; }
      .qr img { width: 100%; height: 100%; display: block; }
      .out-text .mascot { width: 150px; margin-bottom: 8px; filter: drop-shadow(0 18px 22px rgba(28,32,70,.22)); }
      .out-text h2 { font-size: 76px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.02; }
      .out-text .ar { margin-top: 10px; font-family: var(--ar); font-size: 50px; font-weight: 700; color: rgba(18,18,23,.6); direction: rtl; text-align: left; }
      .url { margin-top: 26px; display: inline-flex; align-items: center; height: 64px; border-radius: 32px; padding: 0 30px; font-size: 32px; font-weight: 700; color: #fff;
        background: linear-gradient(135deg, rgba(34,34,42,.94), rgba(18,18,23,.84)); box-shadow: inset 0 1px 1px rgba(255,255,255,.4), 0 16px 30px -16px rgba(18,18,23,.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <div class="ground"></div>
      <div class="orb o1" data-layout-allow-overflow></div><div class="orb o2" data-layout-allow-overflow></div><div class="orb o3" data-layout-allow-overflow></div><div class="orb o4" data-layout-allow-overflow></div>

      <!-- Intro 0 → 3.5 -->
      <div id="intro" class="clip" data-start="0" data-duration="2.8" data-track-index="1">
        <div class="lg intro-card">
          <div class="sheen"></div>
          <img class="mascot" src="assets/mascot.png" alt="" />
          <div class="word">SAWA<span>سوا</span></div>
          <div class="tag">The student app · one front door to school life</div>
          <div class="tag-ar">بوابة واحدة للحياة المدرسية</div>
        </div>
      </div>

      <!-- Demo 3.5 → 34.77 -->
      <div id="demo">
        <div class="lg brand"><img src="assets/logo3d.png" alt="" /><b>SAWA</b><i>Student app</i></div>
        <div class="lg phone">
          <video id="screen" class="clip" src="assets/highlights.mp4" muted playsinline data-start="2.8" data-duration="33.7" data-media-start="0" data-track-index="3"></video>
        </div>
        <div class="lg dots" id="dots"></div>
        <div id="caps"></div>
      </div>

      <!-- Outro 34.77 → 40 -->
      <div id="outro" class="clip" data-start="36.5" data-duration="3.5" data-track-index="4">
        <div class="lg out-card">
          <div class="sheen"></div>
          <div class="qr"><img src="assets/sawa-qr.png" alt="QR code for sawaapp.vercel.app" /></div>
          <div class="out-text">
            <img class="mascot" src="assets/mascot.png" alt="" />
            <h2>Try Sawa now</h2>
            <div class="ar">جرّب سوا الآن</div>
            <div class="url">sawaapp.vercel.app</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // [start, end] are seconds into the highlight reel (it begins at 3.5s on the film clock).
      const CAPS = [
        [0.0, 1.8, "One app for school life", "تطبيق واحد للحياة المدرسية"],
        [1.8, 4.6, "Sign in with Emirates ID", "دخول بالهوية الإماراتية"],
        [4.6, 7.6, "Pick your interests", "اختر اهتماماتك"],
        [7.6, 10.4, "AI matches opportunities", "الذكاء يطابق الفرص"],
        [10.4, 12.8, "Your whole week, at a glance", "أسبوعك كاملاً بنظرة"],
        [12.8, 15.2, "Google Classroom, synced", "مزامنة Google Classroom"],
        [15.2, 18.2, "Calendar with school events", "تقويم بفعاليات المدرسة"],
        [18.2, 21.6, "Reminders & upcoming deadlines", "تذكيرات ومواعيد قادمة"],
        [21.6, 24.8, "Swipe & save opportunities", "تصفّح الفرص واحفظها"],
        [24.8, 27.8, "Safe school communities", "مجتمعات مدرسية آمنة"],
        [27.8, 33.7, "Ask Sawa AI, it acts", "اسأل سوا… وينفّذ"],
      ];
      const OFF = 2.8; const DUR = 33.7;
      const capsEl = document.getElementById("caps");
      const dotsEl = document.getElementById("dots");
      CAPS.forEach(([s, e, en, ar], i) => {
        const d = document.createElement("div");
        d.className = "lg cap";
        d.id = "cap" + i;
        d.innerHTML = `<div class="sheen"></div><div class="n">${String(i + 1).padStart(2, "0")} / ${CAPS.length}</div><div class="en">${en}</div><div class="ar">${ar}</div>`;
        capsEl.appendChild(d);
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.id = "dot" + i;
        dotsEl.appendChild(dot);
      });

      const tl = gsap.timeline({ paused: true });
      tl.set(".phone, .brand, .dots", { opacity: 0 }, 0);

      // ambient colour drift (deterministic)
      tl.to(".o1", { x: 260, y: 140, scale: 1.12, duration: 40, ease: "sine.inOut" }, 0)
        .to(".o2", { x: -240, y: 160, scale: 0.9, duration: 40, ease: "sine.inOut" }, 0)
        .to(".o3", { x: -200, y: -150, scale: 1.08, duration: 40, ease: "sine.inOut" }, 0)
        .to(".o4", { x: -160, y: 120, duration: 40, ease: "sine.inOut" }, 0);

      // intro
      tl.fromTo(".intro-card", { scale: 0.97 }, { scale: 1, duration: 3, ease: "sine.out" }, 0)
        .fromTo("#intro .mascot", { y: 0, rotation: -4 }, { y: -14, rotation: 4, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1)
        .fromTo("#intro .tag, #intro .tag-ar", { opacity: 0.55 }, { opacity: 1, duration: 0.8, stagger: 0.15, ease: "power2.out" }, 0.2)
        .to(".intro-card", { opacity: 0, scale: 1.04, filter: "blur(12px)", duration: 0.4, ease: "power2.in" }, 2.4);

      // demo chrome
      tl.fromTo(".phone", { opacity: 0, y: 70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, OFF)
        .fromTo(".brand, .dots", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08, ease: "power3.out" }, OFF + 0.1)
        .to(".phone, .brand, .dots", { opacity: 0, scale: 0.97, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, OFF + DUR - 0.4);

      // captions: glass slides in, text rises, glass slides out
      CAPS.forEach(([s, e], i) => {
        const at = OFF + s, out = OFF + e;
        tl.fromTo("#cap" + i, { opacity: 0, x: 60, filter: "blur(16px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, at + 0.05)
          .fromTo(`#cap${i} .en, #cap${i} .ar`, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: "power3.out" }, at + 0.12)
          .to("#dot" + i, { backgroundColor: "#121217", width: 30, duration: 0.3, ease: "power2.out" }, at)
          .to("#dot" + i, { backgroundColor: "rgba(18,18,23,.32)", width: 10, duration: 0.3, ease: "power2.out" }, out - 0.05)
          .to("#cap" + i, { opacity: 0, x: -40, filter: "blur(12px)", duration: 0.3, ease: "power2.in" }, out - 0.32);
      });

      // outro
      const O = 36.5;
      tl.fromTo(".out-card", { opacity: 0, scale: 0.92, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, O + 0.05)
        .fromTo(".qr", { opacity: 0, rotation: -6, scale: 0.85 }, { opacity: 1, rotation: 0, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, O + 0.25)
        .fromTo(".out-text > *", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.1, ease: "power3.out" }, O + 0.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
